[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contest2-zeroshot-classifier"
version = "0.1.0"
description = "Resumable zero-shot aspect-based sentiment classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
]

[project.scripts]
zeroshot-classifier = "zeroshot_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
